
name: Check Individual Coin Graduations

on:
  workflow_dispatch:
  schedule:
    - cron: "52 */6 * * *"

permissions:
  contents: write

concurrency:
  group: individual-coin-graduation-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check individual coins
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import pathlib
          import hashlib
          import urllib.request
          import urllib.error
          import time
          from datetime import datetime, timezone

          API_KEY = os.environ.get("PUMP_API_KEY", "")
          LIMIT = 250
          DELAY = 0.5

          if not API_KEY:
              raise RuntimeError(
                  "Missing GitHub secret PUMP_API_KEY"
              )

          folder = pathlib.Path("data")

          mint_data = json.loads(
              (folder / "coin-mints.json").read_text()
          )

          coin_data = json.loads(
              (folder / "developer-coins.json").read_text()
          )

          valid_coins = {
              c["coin_id"]: c
              for c in coin_data.get("coins", [])
              if c.get("coin_id")
          }

          mint_map = {}

          for item in mint_data.get("coins", []):
              cid = item.get("coin_id")
              mint = item.get("mint")

              if not isinstance(mint, str):
                  continue

              if cid not in valid_coins:
                  continue

              if hashlib.sha256(
                  mint.encode()
              ).hexdigest() != cid:
                  continue

              mint_map[cid] = mint

          if not mint_map:
              raise RuntimeError(
                  "No valid mint addresses available"
              )

          output_path = (
              folder / "coin-graduation-checks.json"
          )

          previous = {}

          if output_path.exists():
              old = json.loads(
                  output_path.read_text()
              )

              for item in old.get("coins", []):
                  cid = item.get("coin_id")

                  if cid in valid_coins:
                      previous[cid] = item

          # Preserve graduations confirmed by
          # the existing graduation collector.
          graduation_path = (
              folder / "graduation-results.json"
          )

          if graduation_path.exists():
              graduation_data = json.loads(
                  graduation_path.read_text()
              )

              for item in graduation_data.get(
                  "confirmed_coins", []
              ):
                  cid = item.get("coin_id")

                  if cid not in valid_coins:
                      continue

                  existing = previous.get(cid, {})

                  previous[cid] = {
                      **existing,
                      "coin_id": cid,
                      "developer_id": valid_coins[cid][
                          "developer_id"
                      ],
                      "launch_date": valid_coins[cid][
                          "launch_date"
                      ],
                      "graduated": True,
                      "graduated_at": (
                          existing.get("graduated_at")
                          or item.get("graduated_at")
                      ),
                      "checked_at": existing.get(
                          "checked_at"
                      ),
                      "source": existing.get(
                          "source", "graduation_feed"
                      )
                  }

          # Skip confirmed graduates.
          candidates = [
              cid for cid in mint_map
              if not previous.get(
                  cid, {}
              ).get("graduated", False)
          ]

          # Check never-tested coins first.
          # Revisit the oldest checks later.
          candidates.sort(
              key=lambda cid: (
                  bool(
                      previous.get(cid, {}).get(
                          "checked_at"
                      )
                  ),
                  previous.get(cid, {}).get(
                      "checked_at"
                  ) or "",
                  valid_coins[cid].get(
                      "launch_date", ""
                  ),
                  cid
              )
          )

          selected = candidates[:LIMIT]

          print(
              "Available mint addresses:",
              len(mint_map)
          )
          print(
              "Coins selected:",
              len(selected)
          )

          successful = 0
          newly_confirmed = 0
          failures = 0

          now = datetime.now(
              timezone.utc
          ).isoformat()

          for index, cid in enumerate(selected, 1):
              mint = mint_map[cid]

              url = (
                  "https://pumpdata.fun/launch/"
                  + mint
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-api-key": API_KEY,
                      "User-Agent": "Pumpwatch/1.3"
                  }
              )

              payload = None

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=45
                      ) as response:
                          payload = json.load(response)
                      break

                  except urllib.error.HTTPError as error:
                      print(
                          "HTTP error:",
                          error.code,
                          "coin:",
                          cid[:12]
                      )

                      if error.code in (
                          401, 402, 403, 429
                      ):
                          raise RuntimeError(
                              "API authentication, billing "
                              "or rate-limit response: "
                              + str(error.code)
                          )

                  except Exception as error:
                      print(
                          "Request error:",
                          type(error).__name__,
                          "coin:",
                          cid[:12]
                      )

                  if attempt < 2:
                      time.sleep(3 * (attempt + 1))

              if not isinstance(payload, dict):
                  failures += 1
                  continue

              # FIX: Support both Pumpdata formats.
              # The launch endpoint may return
              # the coin data directly rather than
              # inside a nested 'launch' object.
              nested = payload.get("launch")

              if isinstance(nested, dict):
                  launch = nested
              else:
                  launch = payload

              if not isinstance(launch, dict):
                  failures += 1
                  print(
                      "Invalid API response:",
                      cid[:12]
                  )
                  continue

              # Confirm the response belongs
              # to the requested token.
              returned_mint = launch.get("mint")

              if (
                  returned_mint is not None
                  and returned_mint != mint
              ):
                  failures += 1
                  print(
                      "Mint mismatch:",
                      cid[:12]
                  )
                  continue

              # A missing migration field means
              # unknown, not ungraduated.
              if "migrated_at" not in launch:
                  failures += 1
                  print(
                      "Missing migration field:",
                      cid[:12]
                  )
                  continue

              migrated = launch.get("migrated_at")

              graduated = (
                  migrated is not None
                  and migrated is not False
                  and migrated != ""
              )

              was_graduated = previous.get(
                  cid, {}
              ).get("graduated", False)

              previous[cid] = {
                  "coin_id": cid,
                  "developer_id": valid_coins[cid][
                      "developer_id"
                  ],
                  "launch_date": valid_coins[cid][
                      "launch_date"
                  ],
                  "graduated": bool(
                      graduated or was_graduated
                  ),
                  "graduated_at": (
                      migrated
                      if graduated
                      else previous.get(
                          cid, {}
                      ).get("graduated_at")
                  ),
                  "checked_at": now,
                  "source": (
                      "individual_coin_api"
                      if graduated
                      else previous.get(
                          cid, {}
                      ).get(
                          "source",
                          "individual_coin_api"
                      )
                  )
              }

              successful += 1

              if graduated and not was_graduated:
                  newly_confirmed += 1

              if index % 25 == 0:
                  print(
                      "Progress:",
                      index,
                      "/",
                      len(selected),
                      "successful:",
                      successful
                  )

              time.sleep(DELAY)

          if selected and successful == 0:
              raise RuntimeError(
                  "No successful API checks. "
                  "Previous results remain unchanged."
              )

          # Retain current rolling-window coins.
          previous = {
              cid: item
              for cid, item in previous.items()
              if cid in valid_coins
          }

          checked = sum(
              1 for item in previous.values()
              if item.get("checked_at")
          )

          confirmed = sum(
              1 for item in previous.values()
              if item.get("graduated") is True
          )

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "period_start": coin_data.get(
                  "period_start"
              ),
              "period_end": coin_data.get(
                  "period_end"
              ),
              "mint_addresses_available": len(
                  mint_map
              ),
              "coins_checked_at_least_once": checked,
              "confirmed_graduations": confirmed,
              "checks_successful_this_run": successful,
              "new_graduations_this_run": newly_confirmed,
              "checks_failed_this_run": failures,
              "note": (
                  "Individual coin migration checks. "
                  "Graduation is confirmed when "
                  "launch.migrated_at is populated. "
                  "Unchecked coins remain unknown. "
                  "Confirmed feed graduations are "
                  "preserved. Results are not yet "
                  "merged into the public leaderboard."
              ),
              "coins": sorted(
                  previous.values(),
                  key=lambda item: (
                      item.get("launch_date", ""),
                      item["coin_id"]
                  ),
                  reverse=True
              )
          }

          output_path.write_text(
              json.dumps(
                  output,
                  separators=(",", ":")
              ) + "\n"
          )

          print("SUCCESS")
          print("Successful checks:", successful)
          print("Failed checks:", failures)
          print(
              "New graduations:",
              newly_confirmed
          )
          print(
              "Coins checked at least once:",
              checked
          )
          print(
              "Total confirmed graduations:",
              confirmed
          )
          PY

      - name: Commit graduation checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/coin-graduation-checks.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update individual graduation checks"
            git pull --rebase origin main
            git push
          fi
