
name: Build Top 100 and Top 500 Developers

on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: write

concurrency:
  group: pumpfun-ranking
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build developer leaderboards
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import pathlib
          import time
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta

          folder = pathlib.Path("data")
          folder.mkdir(exist_ok=True)

          today = datetime.now(timezone.utc).date()
          cutoff = today - timedelta(days=29)

          history_path = folder / "rank-history.json"

          if history_path.exists():
              history = json.loads(
                  history_path.read_text()
              )
          else:
              history = {}

          for offset in range(3):
              day = today - timedelta(days=offset)
              date = day.isoformat()

              url = (
                  "https://pumpdata.fun/launches/"
                  + date + ".json"
              )

              feed = None

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "PumpLeaderboard/1.1"
                          }
                      )

                      with urllib.request.urlopen(
                          req, timeout=180
                      ) as response:
                          feed = json.load(response)

                      break

                  except Exception as error:
                      print(
                          date,
                          "attempt", attempt + 1,
                          type(error).__name__
                      )

                      if attempt < 2:
                          time.sleep(
                              10 * (attempt + 1)
                          )

              if feed is None:
                  print("Unavailable:", date)
                  continue

              columns = feed.get("columns", [])

              positions = {
                  name: i
                  for i, name in enumerate(columns)
              }

              if "creator" not in positions:
                  print("Missing creator:", date)
                  continue

              counts = defaultdict(
                  lambda: {
                      "launches": 0,
                      "previous_graduations": 0,
                      "graduated_launches": 0
                  }
              )

              for row in feed.get("launches", []):
                  if not isinstance(
                      row, (list, tuple)
                  ):
                      continue

                  creator_index = positions["creator"]

                  if len(row) <= creator_index:
                      continue

                  wallet = row[creator_index]

                  if (
                      not isinstance(wallet, str)
                      or not wallet
                  ):
                      continue

                  dev_id = hashlib.sha256(
                      wallet.encode()
                  ).hexdigest()

                  item = counts[dev_id]
                  item["launches"] += 1

                  if (
                      "deployer_graduations_before"
                      in positions
                  ):
                      index = positions[
                          "deployer_graduations_before"
                      ]

                      try:
                          previous = int(
                              row[index] or 0
                          )
                      except (
                          TypeError,
                          ValueError,
                          IndexError
                      ):
                          previous = 0

                      item[
                          "previous_graduations"
                      ] = max(
                          item["previous_graduations"],
                          previous
                      )

                  if "migrated_at" in positions:
                      index = positions["migrated_at"]

                      if (
                          len(row) > index
                          and row[index]
                      ):
                          item[
                              "graduated_launches"
                          ] += 1

              history[date] = dict(counts)

              print(
                  "Processed:", date,
                  "developers:", len(counts)
              )

          history = {
              date: records
              for date, records in sorted(
                  history.items()
              )
              if (
                  cutoff.isoformat()
                  <= date
                  <= today.isoformat()
              )
          }

          developers = defaultdict(
              lambda: {
                  "launches_30d": 0,
                  "graduated_launches_observed": 0,
                  "previous_graduations_max": 0,
                  "active_days": 0
              }
          )

          for date, records in history.items():
              for dev_id, stats in records.items():
                  dev = developers[dev_id]

                  dev["launches_30d"] += (
                      stats["launches"]
                  )

                  dev[
                      "graduated_launches_observed"
                  ] += stats[
                      "graduated_launches"
                  ]

                  dev[
                      "previous_graduations_max"
                  ] = max(
                      dev[
                          "previous_graduations_max"
                      ],
                      stats[
                          "previous_graduations"
                      ]
                  )

                  dev["active_days"] += 1

          ranking = sorted(
              developers.items(),
              key=lambda pair: (
                  -pair[1]["launches_30d"],
                  -pair[1][
                      "graduated_launches_observed"
                  ],
                  pair[0]
              )
          )

          # Build one consistent ranking.
          ranked = []

          for rank, (
              dev_id, stats
          ) in enumerate(ranking[:500], 1):

              ranked.append({
                  "rank": rank,
                  "developer_id": dev_id[:16],
                  **stats
              })

          now = datetime.now(
              timezone.utc
          ).isoformat()

          common = {
              "updated_at": now,
              "days_collected": len(history),
              "period_start": cutoff.isoformat(),
              "period_end": today.isoformat(),
              "ranking_method": "launch_count",
              "market_cap_ranking_available": False,
              "total_developers": len(developers)
          }

          # Preserve existing Top 100 format.
          top100 = {
              **common,
              "top_100": ranked[:100]
          }

          # New Top 500 format.
          top500 = {
              **common,
              "top_500": ranked[:500]
          }

          history_path.write_text(
              json.dumps(
                  history,
                  separators=(",", ":")
              )
          )

          (folder / "top100.json").write_text(
              json.dumps(top100, indent=2) + "\n"
          )

          (folder / "top500.json").write_text(
              json.dumps(top500, indent=2) + "\n"
          )

          print("DAYS:", len(history))
          print(
              "TOTAL DEVELOPERS:",
              len(developers)
          )
          print(
              "TOP 100:",
              len(top100["top_100"])
          )
          print(
              "TOP 500:",
              len(top500["top_500"])
          )
          print("SUCCESS")
          PY

      - name: Save leaderboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/rank-history.json \
            data/top100.json \
            data/top500.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Top 100 and Top 500 developers"
            git pull --rebase origin main
            git push
          fi
