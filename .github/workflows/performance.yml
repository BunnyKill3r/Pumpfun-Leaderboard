
name: Collect Developer Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */6 * * *'

permissions:
  contents: write

concurrency:
  group: pumpfun-performance
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch developer performance
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import hashlib
          import pathlib
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          folder = pathlib.Path("data")
          ranking_path = folder / "top100.json"

          if not ranking_path.exists():
              raise SystemExit("Missing data/top100.json")

          api_key = os.environ.get("PUMP_API_KEY")
          if not api_key:
              raise SystemExit("Missing PUMP_API_KEY secret")

          ranking = json.loads(ranking_path.read_text())
          top = ranking.get("top_100", [])

          targets = {
              item["developer_id"]: item
              for item in top
          }

          found = {}
          today = datetime.now(timezone.utc).date()

          def fetch_json(url, headers=None):
              request = urllib.request.Request(
                  url,
                  headers=headers or {
                      "User-Agent": "Pumpwatch/1.0"
                  }
              )
              with urllib.request.urlopen(
                  request, timeout=180
              ) as response:
                  return json.load(response)

          for offset in range(3):
              date = (today - timedelta(days=offset)).isoformat()
              url = (
                  "https://pumpdata.fun/launches/"
                  + date + ".json"
              )

              try:
                  feed = fetch_json(url)
              except Exception as error:
                  print(
                      "Feed unavailable:",
                      date, type(error).__name__
                  )
                  continue

              columns = feed.get("columns", [])
              if "creator" not in columns:
                  continue

              creator_index = columns.index("creator")

              for row in feed.get("launches", []):
                  wallet = row[creator_index]
                  if not isinstance(wallet, str):
                      continue

                  identifier = hashlib.sha256(
                      wallet.encode()
                  ).hexdigest()[:16]

                  if identifier in targets:
                      found[identifier] = wallet

              print(
                  date,
                  "matched developers:",
                  len(found)
              )

          output = []

          for item in top:
              identifier = item["developer_id"]
              wallet = found.get(identifier)

              record = {}
              if wallet:
                  url = (
                      "https://pumpdata.fun/deployer/"
                      + wallet
                  )

                  for attempt in range(3):
                      try:
                          response = fetch_json(
                              url,
                              headers={
                                  "x-api-key": api_key,
                                  "User-Agent": "Pumpwatch/1.0"
                              }
                          )
                          record = response.get("record", {})
                          break
                      except Exception as error:
                          print(
                              "Lookup failed for rank",
                              item["rank"],
                              type(error).__name__
                          )
                          if attempt < 2:
                              time.sleep(5)

                  time.sleep(0.25)

              output.append({
                  "rank_by_launches": item["rank"],
                  "developer_id": identifier,
                  "launches_30d": item["launches_30d"],
                  "active_days": item["active_days"],
                  "observed_graduations": item.get(
                      "graduated_launches_observed", 0
                  ),
                  "all_time_launches": record.get("launches"),
                  "all_time_graduations": record.get("graduations"),
                  "all_time_graduation_rate": record.get(
                      "graduation_rate"
                  ),
                  "all_time_best_peak_usd": record.get(
                      "best_peak_usd"
                  ),
                  "performance_available": bool(record)
              })

          result = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "ranking_period_start": ranking.get(
                  "period_start"
              ),
              "ranking_period_end": ranking.get(
                  "period_end"
              ),
              "description": (
                  "Top developers selected by launches "
                  "during the collected rolling window. "
                  "Market-cap peaks and graduation rates "
                  "are all-time developer statistics."
              ),
              "matched_developers": len(found),
              "performance_records": sum(
                  bool(item["performance_available"])
                  for item in output
              ),
              "developers": output
          }

          folder.mkdir(exist_ok=True)
          (folder / "developer-performance.json").write_text(
              json.dumps(result, indent=2)
          )

          print("MATCHED:", len(found))
          print(
              "PERFORMANCE RECORDS:",
              result["performance_records"]
          )
          print("DEVELOPER PERFORMANCE READY")
          PY

      - name: Save performance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/developer-performance.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update developer performance"
            git pull --rebase origin main
            git push
          fi

