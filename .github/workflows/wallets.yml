
name: Collect Developer Wallets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: developer-wallet-collector
  cancel-in-progress: false

jobs:
  wallets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect and retain wallet mappings
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import pathlib
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta

          folder = pathlib.Path("data")
          folder.mkdir(exist_ok=True)

          ranking = json.loads(
              (folder / "top100.json").read_text()
          )

          top = ranking.get("top_100", [])
          if not isinstance(top, list) or not top:
              raise RuntimeError("Top 100 ranking is empty")

          targets = {
              str(item["developer_id"])
              for item in top
          }

          existing_path = folder / "wallets.json"
          known = {}

          if existing_path.exists():
              existing = json.loads(
                  existing_path.read_text()
              )

              for item in existing.get("developers", []):
                  wallet = item.get("wallet")
                  identifier = item.get("developer_id")

                  if not isinstance(wallet, str):
                      continue

                  calculated = hashlib.sha256(
                      wallet.encode()
                  ).hexdigest()[:16]

                  if calculated == identifier:
                      known[identifier] = wallet

          print("Previously known wallets:", len(known))

          today = datetime.now(timezone.utc).date()
          successful_feeds = 0

          for offset in range(3):
              day = today - timedelta(days=offset)

              url = (
                  "https://pumpdata.fun/launches/"
                  + day.isoformat() + ".json"
              )

              feed = None

              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Pumpwatch/1.0"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:
                          feed = json.load(response)

                      break

                  except Exception as error:
                      print(
                          "Fetch failed:",
                          day,
                          type(error).__name__,
                          str(error)[:150]
                      )

                      if attempt < 2:
                          time.sleep(10)

              if feed is None:
                  continue

              columns = feed.get("columns", [])

              if "creator" not in columns:
                  print("Creator column missing:", day)
                  continue

              creator_index = columns.index("creator")
              successful_feeds += 1

              for row in feed.get("launches", []):
                  if len(row) <= creator_index:
                      continue

                  wallet = row[creator_index]

                  if not isinstance(wallet, str):
                      continue

                  identifier = hashlib.sha256(
                      wallet.encode()
                  ).hexdigest()[:16]

                  if identifier in targets:
                      known[identifier] = wallet

              print(
                  day,
                  "current Top 100 matches:",
                  len(targets.intersection(known))
              )

          if successful_feeds == 0:
              raise RuntimeError(
                  "No daily feeds available; keeping old file"
              )

          selected = []

          for developer in top:
              identifier = str(
                  developer["developer_id"]
              )

              if identifier in known:
                  selected.append({
                      "developer_id": identifier,
                      "wallet": known[identifier]
                  })

              if len(selected) >= 100:
                  break

          # Do not overwrite a useful existing mapping
          # with an empty result.
          if not selected:
              raise RuntimeError(
                  "No matching wallets found"
              )

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "matched": len(selected),
              "developers": selected
          }

          existing_path.write_text(
              json.dumps(output, indent=2) + "\n"
          )

          print("Wallets published:", len(selected))
          print("Wallet collection completed")
          PY

      - name: Commit wallet mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/wallets.json

          if git diff --cached --quiet; then
            echo "No wallet changes"
          else
            git commit -m "Update developer wallet mappings"
            git pull --rebase origin main
            git push
          fi
