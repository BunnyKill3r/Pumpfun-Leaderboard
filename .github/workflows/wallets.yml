name: Collect Top 500 Developer Wallets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: developer-wallet-collector
  cancel-in-progress: false

jobs:
  wallets:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Recover missing wallets and preserve verified mappings
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          folder = pathlib.Path('data')
          folder.mkdir(exist_ok=True)
          ranking_path = folder / 'top500.json'
          wallet_path = folder / 'wallets.json'

          if not ranking_path.exists():
              raise RuntimeError('data/top500.json missing; run ranking workflow first')

          ranking = json.loads(ranking_path.read_text())
          top = ranking.get('top_500')
          if not isinstance(top, list) or not top:
              raise RuntimeError('Top 500 ranking missing or empty')

          ordered_ids = []
          for item in top:
              identifier = item.get('developer_id') if isinstance(item, dict) else None
              if not isinstance(identifier, str) or len(identifier) != 16:
                  raise RuntimeError('Invalid developer_id in Top 500 ranking')
              if identifier in ordered_ids:
                  raise RuntimeError('Duplicate developer_id in Top 500 ranking')
              ordered_ids.append(identifier)
          targets = set(ordered_ids)

          existing = json.loads(wallet_path.read_text()) if wallet_path.exists() else {}
          known = {}
          rejected = 0
          for item in existing.get('developers', []):
              if not isinstance(item, dict):
                  rejected += 1
                  continue
              wallet = item.get('wallet')
              identifier = item.get('developer_id')
              if (not isinstance(wallet, str) or not isinstance(identifier, str)
                      or hashlib.sha256(wallet.encode()).hexdigest()[:16] != identifier):
                  rejected += 1
                  continue
              known[identifier] = wallet

          missing = targets - known.keys()
          initially_missing = len(missing)
          print('Target developers:', len(targets))
          print('Previously verified wallets:', len(known))
          print('Missing before recovery:', initially_missing)
          print('Rejected invalid old mappings:', rejected)

          # Search 60 days instead of 30, newest first. Older feeds may
          # recover a developer who has no launches in the last 30 days.
          # Stop immediately when all targets are recovered.
          today = datetime.now(timezone.utc).date()
          processed = 0
          unavailable = []
          newly_found = 0

          for offset in range(60):
              if not missing:
                  break
              date = (today - timedelta(days=offset)).isoformat()
              url = f'https://pumpdata.fun/launches/{date}.json'
              feed = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url, headers={'User-Agent': 'Pumpwatch/1.3'}
                      )
                      with urllib.request.urlopen(request, timeout=75) as response:
                          feed = json.load(response)
                      break
                  except Exception as exc:
                      print(f'{date}: attempt {attempt + 1} failed: {type(exc).__name__}: {str(exc)[:100]}')
                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))

              if not isinstance(feed, dict):
                  unavailable.append(date)
                  continue
              columns = feed.get('columns')
              launches = feed.get('launches')
              if not isinstance(columns, list) or 'creator' not in columns or not isinstance(launches, list):
                  unavailable.append(date)
                  print(f'{date}: invalid feed structure')
                  continue

              creator_index = columns.index('creator')
              processed += 1
              day_matches = 0
              for row in launches:
                  if not isinstance(row, (list, tuple)) or len(row) <= creator_index:
                      continue
                  wallet = row[creator_index]
                  if not isinstance(wallet, str) or not wallet:
                      continue
                  identifier = hashlib.sha256(wallet.encode()).hexdigest()[:16]
                  if identifier in missing:
                      known[identifier] = wallet
                      missing.remove(identifier)
                      newly_found += 1
                      day_matches += 1
                      if not missing:
                          break
              print(f'{date}: recovered {day_matches}; remaining {len(missing)}')

          matched = len(targets - missing)
          if matched == 0:
              raise RuntimeError('No verified Top 500 wallets; preserving existing file')

          # Keep current Top 500 first, in ranking order, followed by all
          # verified historical mappings for future ranking changes.
          selected_ids = [identifier for identifier in ordered_ids if identifier in known]
          selected_ids.extend(sorted(set(known) - targets))
          selected = [{'developer_id': identifier, 'wallet': known[identifier]}
                      for identifier in selected_ids]

          # Avoid committing a new timestamp every six hours when nothing changed.
          old_developers = existing.get('developers', [])
          old_targets = existing.get('target_developers')
          old_matched = existing.get('matched')
          old_missing = existing.get('missing')
          changed = (selected != old_developers or old_targets != len(targets)
                     or old_matched != matched or old_missing != len(missing))

          if changed:
              output = {
                  'updated_at': datetime.now(timezone.utc).isoformat(),
                  'target_developers': len(targets),
                  'matched': matched,
                  'missing': len(missing),
                  'total_wallets_retained': len(selected),
                  'feeds_processed': processed,
                  'developers': selected,
              }
              wallet_path.write_text(json.dumps(output, indent=2) + '\n')
          else:
              print('No mapping or ranking changes; wallets.json unchanged')

          print('========== WALLET RESULTS ==========')
          print('Top 500 targets:', len(targets))
          print('Top 500 matched:', matched)
          print('Top 500 missing:', len(missing))
          print('New wallets recovered:', newly_found)
          print('Total verified wallets retained:', len(selected))
          print('Feeds processed:', processed)
          print('Feeds unavailable or invalid:', len(unavailable))
          print('Missing developer IDs:', ', '.join(sorted(missing)) or 'None')
          print('====================================')
          PY

      - name: Commit wallet mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/wallets.json
          if git diff --cached --quiet; then
            echo "No wallet changes"
          else
            git commit -m "Recover and retain Top 500 developer wallet mappings"
            git pull --rebase origin main
            git push
          fi
