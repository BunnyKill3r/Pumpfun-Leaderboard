name: Test Pumpdata API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test historical API
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error, re
          key = os.environ.get('PUMP_API_KEY', '').strip()
          if not key:
              raise SystemExit('PUMP_API_KEY secret missing')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(path):
              start = time.monotonic()
              print('\n===', path, '===')
              req = urllib.request.Request('https://pumpdata.fun' + path, headers={'x-api-key': key, 'Accept': 'application/json', 'User-Agent': 'PrivateTrackerTest/1.0'})
              try:
                  with opener.open(req, timeout=25) as r:
                      print('HTTP:', r.status, 'Seconds:', round(time.monotonic()-start, 2))
                      for k, v in r.headers.items():
                          if k.lower().startswith(('x-ratelimit', 'ratelimit', 'x-data-as-of', 'retry-after')):
                              print(k, ':', v.replace(key, '[REDACTED]'))
                      data = json.load(r)
              except urllib.error.HTTPError as e:
                  print('HTTP:', e.code, 'Retry-After:', e.headers.get('Retry-After', 'not supplied'))
                  if e.code in (401, 402, 403, 429):
                      raise SystemExit('Stopped: authentication, payment or rate limit response. No payment attempted.')
                  return None
              except (OSError, ValueError) as e:
                  print('Request failed:', type(e).__name__)
                  return None
              return data
          def show(data):
              print(json.dumps(data, indent=2).replace(key, '[REDACTED]')[:18000])
          wallets = ['7ufmve7ZSFCzuNcKRunYrGtyb2Ka1MXzkWwf7jZhVsmL', 'g2kai8M6mJQroTG1EGGtP4RQHaqStDgsXGkukLutzo9']
          mints = []
          for wallet in wallets:
              data = get('/deployer/' + wallet)
              if not isinstance(data, dict):
                  continue
              print('Top-level fields:', list(data))
              show({k: v for k, v in data.items() if not isinstance(v, list)})
              for field, rows in data.items():
                  if not isinstance(rows, list):
                      continue
                  print('List:', field, 'Length:', len(rows))
                  show(rows[:2])
                  if field in ('recent_launches', 'launches', 'coins'):
                      for row in rows:
                          if isinstance(row, dict):
                              mint = row.get('mint')
                              if isinstance(mint, str) and re.fullmatch(r'[1-9A-HJ-NP-Za-km-z]{32,44}', mint):
                                  mints.append((mint, row.get('graduated')))
              print('Record total versus recent list:', data.get('record', {}).get('launches') if isinstance(data.get('record'), dict) else None, len(data.get('recent_launches', [])))
          selected = []
          for status in (True, False, None):
              for mint, graduated in mints:
                  if graduated is status and mint not in selected:
                      selected.append(mint)
                      break
          for mint, _ in mints:
              if mint not in selected and len(selected) < 4:
                  selected.append(mint)
          if not selected:
              selected = ['AT4eR1u97PVZkvbzeARS5eSYXcnKt9b6qXsvxPnzpump']
          for mint in selected[:4]:
              data = get('/launch/' + mint)
              if isinstance(data, dict):
                  print('Top-level fields:', list(data))
                  show(data)
          data = get('/coin?q=' + selected[0])
          if data is not None:
              show(data)
          print('\nTest complete. Peak fields require timeframe and supply verification before labeling as lifetime ATH.')
          PY
