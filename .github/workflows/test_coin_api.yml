
name: Test Coin Performance API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test five individual coins
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import hashlib
          import pathlib
          import urllib.request
          import urllib.error
          import time
          from datetime import datetime, timezone, timedelta

          key = os.environ.get("PUMP_API_KEY", "")

          if not key:
              raise RuntimeError(
                  "Missing GitHub secret PUMP_API_KEY"
              )

          folder = pathlib.Path("data")
          folder.mkdir(exist_ok=True)

          wallets = json.loads(
              (folder / "wallets.json").read_text()
          )

          target_wallets = {
              item["wallet"]
              for item in wallets.get("developers", [])
              if item.get("wallet")
          }

          today = datetime.now(timezone.utc).date()
          samples = []
          seen = set()

          # Recover actual mints from public feeds.
          # Do not publish those addresses in Git.
          for offset in range(3):
              if len(samples) >= 5:
                  break

              day = today - timedelta(days=offset)
              url = (
                  "https://pumpdata.fun/launches/"
                  + day.isoformat() + ".json"
              )

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Pumpwatch/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req, timeout=180
                  ) as response:
                      feed = json.load(response)

              except Exception as error:
                  print(
                      "Feed unavailable:",
                      day,
                      type(error).__name__
                  )
                  continue

              columns = feed.get("columns", [])

              if not all(
                  name in columns
                  for name in ("creator", "mint")
              ):
                  continue

              ci = columns.index("creator")
              mi = columns.index("mint")

              for row in feed.get("launches", []):
                  if len(samples) >= 5:
                      break

                  if not isinstance(row, (list, tuple)):
                      continue

                  if len(row) <= max(ci, mi):
                      continue

                  creator = row[ci]
                  mint = row[mi]

                  if creator not in target_wallets:
                      continue

                  if not isinstance(mint, str):
                      continue

                  if mint in seen:
                      continue

                  seen.add(mint)
                  samples.append(mint)

          if not samples:
              raise RuntimeError(
                  "No matching coins found in daily feeds"
              )

          print("Coins selected:", len(samples))

          def inspect(value, prefix="", depth=0):
              """
              Return field names and value types.
              Never expose addresses or raw text.
              """
              fields = []

              if not isinstance(value, dict):
                  return fields

              for name, child in value.items():
                  path = (
                      prefix + "." + name
                      if prefix else name
                  )

                  if isinstance(child, dict):
                      fields.append({
                          "field": path,
                          "type": "object"
                      })

                      if depth < 3:
                          fields.extend(
                              inspect(child, path, depth + 1)
                          )

                  elif isinstance(child, list):
                      fields.append({
                          "field": path,
                          "type": "array",
                          "length": len(child)
                      })

                  elif isinstance(child, bool):
                      fields.append({
                          "field": path,
                          "type": "boolean",
                          "value": child
                      })

                  elif isinstance(child, (int, float)):
                      entry = {
                          "field": path,
                          "type": "number"
                      }

                      # Only show values for relevant
                      # numeric performance fields.
                      terms = (
                          "peak", "ath", "market_cap",
                          "graduat", "mult"
                      )

                      if any(
                          term in path.lower()
                          for term in terms
                      ):
                          entry["value"] = child

                      fields.append(entry)

                  elif child is None:
                      fields.append({
                          "field": path,
                          "type": "null"
                      })

                  else:
                      fields.append({
                          "field": path,
                          "type": "string"
                      })

              return fields

          results = []

          for index, mint in enumerate(samples, 1):
              coin_id = hashlib.sha256(
                  mint.encode()
              ).hexdigest()

              record = {
                  "sample": index,
                  "coin_id": coin_id,
                  "endpoints": {}
              }

              endpoints = {
                  "launch": (
                      "https://pumpdata.fun/launch/"
                      + mint
                  ),
                  "check": (
                      "https://pumpdata.fun/check/"
                      + mint + ".json"
                  )
              }

              for label, url in endpoints.items():
                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-api-key": key,
                          "User-Agent": "Pumpwatch/1.0"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=60
                      ) as response:
                          payload = json.load(response)
                          status = response.status

                      record["endpoints"][label] = {
                          "http_status": status,
                          "fields": inspect(payload)
                      }

                      print(
                          "Sample", index,
                          label, "HTTP", status
                      )

                  except urllib.error.HTTPError as e:
                      record["endpoints"][label] = {
                          "http_status": e.code,
                          "error": "HTTP request failed"
                      }

                      print(
                          "Sample", index,
                          label, "HTTP", e.code
                      )

                  except Exception as e:
                      record["endpoints"][label] = {
                          "error": type(e).__name__
                      }

                      print(
                          "Sample", index,
                          label, "request failed"
                      )

                  time.sleep(1)

              results.append(record)

          report = {
              "tested_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "coins_tested": len(samples),
              "note": (
                  "API field inspection only. "
                  "No raw mints, wallet addresses "
                  "or API keys are included."
              ),
              "results": results
          }

          path = folder / "coin-api-test.json"

          path.write_text(
              json.dumps(report, indent=2) + "\n"
          )

          print("Diagnostic report created")
          PY

      - name: Save diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/coin-api-test.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Test coin API performance fields"
            git pull --rebase origin main
            git push
          fi

