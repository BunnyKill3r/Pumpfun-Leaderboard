
name: Collect Pumpfun Developers

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: pumpfun-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect launches and rank developers
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict

          folder = pathlib.Path("data")
          folder.mkdir(exist_ok=True)

          today = datetime.now(timezone.utc).date()
          cutoff = today - timedelta(days=29)

          # Store one file per UTC launch date.
          # Refresh the latest three days each run.
          for offset in range(3):
              day = today - timedelta(days=offset)
              name = day.isoformat()
              url = (
                  "https://pumpdata.fun/launches/"
                  + name + ".json"
              )

              print("Fetching:", name)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PumpLeaderboard/1.0"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=120
                  ) as response:
                      data = json.load(response)

              except urllib.error.HTTPError as error:
                  print("Feed unavailable:", error.code)
                  continue

              columns = data["columns"]
              launches = data["launches"]

              # Preserve only fields needed for
              # discovery and rankings.
              compact = []
              for row in launches:
                  coin = dict(zip(columns, row))
                  wallet = coin.get("creator")

                  if not wallet:
                      continue

                  mint = (
                      coin.get("mint")
                      or coin.get("token_address")
                      or coin.get("coin_mint")
                      or coin.get("address")
                  )

                  compact.append({
                      "wallet": wallet,
                      "mint": mint,
                      "previous_graduations":
                          coin.get(
                              "deployer_graduations_before",
                              0
                          )
                  })

              path = folder / (name + ".json")
              path.write_text(
                  json.dumps(compact, separators=(",", ":"))
              )

              print("Launches saved:", len(compact))
              print("Feed columns:", columns)

          # Remove daily files older than 30 days.
          for path in folder.glob("????-??-??.json"):
              try:
                  day = datetime.strptime(
                      path.stem, "%Y-%m-%d"
                  ).date()
              except ValueError:
                  continue

              if day < cutoff:
                  path.unlink()

          developers = defaultdict(lambda: {
              "launches_30d": 0,
              "previous_graduations_max": 0,
              "tokens": [],
              "active_days": set()
          })

          total = 0
          days = []

          for path in sorted(
              folder.glob("????-??-??.json")
          ):
              day = path.stem
              days.append(day)

              for coin in json.loads(path.read_text()):
                  wallet = coin["wallet"]
                  record = developers[wallet]

                  record["launches_30d"] += 1
                  record["active_days"].add(day)

                  previous = (
                      coin.get("previous_graduations")
                      or 0
                  )
                  record["previous_graduations_max"] = max(
                      record["previous_graduations_max"],
                      previous
                  )

                  if coin.get("mint"):
                      record["tokens"].append({
                          "mint": coin["mint"],
                          "date": day
                      })

                  total += 1

          leaderboard = []

          for wallet, record in developers.items():
              leaderboard.append({
                  "wallet": wallet,
                  "launches_30d":
                      record["launches_30d"],
                  "previous_graduations":
                      record["previous_graduations_max"],
                  "active_days":
                      len(record["active_days"]),
                  "tokens": record["tokens"]
              })

          leaderboard.sort(
              key=lambda d: (
                  d["launches_30d"],
                  d["previous_graduations"]
              ),
              reverse=True
          )

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "period_start": cutoff.isoformat(),
              "period_end": today.isoformat(),
              "days_collected": len(days),
              "total_launches": total,
              "total_developers": len(leaderboard),
              "ranking_method": "launches_30d",
              "developers": leaderboard
          }

          (folder / "leaderboard.json").write_text(
              json.dumps(output, separators=(",", ":"))
          )

          print("TOTAL LAUNCHES:", total)
          print("UNIQUE DEVELOPERS:", len(leaderboard))
          print("DAYS COLLECTED:", len(days))
          print("TOP 10 DEVELOPERS:")

          for rank, dev in enumerate(
              leaderboard[:10], start=1
          ):
              print(
                  rank,
                  dev["wallet"],
                  "Launches:",
                  dev["launches_30d"],
                  "Previous graduations:",
                  dev["previous_graduations"]
              )

          print("LEADERBOARD DATA READY")
          PY

      - name: Save results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Pumpfun leaderboard"
            git push
          fi
