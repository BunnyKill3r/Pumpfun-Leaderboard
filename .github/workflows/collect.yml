
name: Collect Pumpdata Developers

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect developer data
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import pathlib
          import datetime
          import urllib.request

          key = os.environ.get("PUMP_API_KEY")
          if not key:
              raise SystemExit("Missing API key")

          folder = pathlib.Path("data")
          folder.mkdir(exist_ok=True)
          path = folder / "developers.json"

          if path.exists():
              records = json.loads(path.read_text())
          else:
              records = {}

          wallets = [
              "7ufmve7ZSFCzuNcKRunYrGtyb2Ka1MXzkWwf7jZhVsmL"
          ]

          now = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat()

          for wallet in wallets:
              url = (
                  "https://pumpdata.fun/deployer/"
                  + wallet
              )
              request = urllib.request.Request(
                  url,
                  headers={"x-api-key": key}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  data = json.load(response)

              records[wallet] = {
                  "wallet": wallet,
                  "updated_at": now,
                  "record": data.get("record", {})
              }
              print("Updated developer:", wallet)

          path.write_text(
              json.dumps(records, indent=2)
              + "\n"
          )
          print("Collection complete")
          PY

      - name: Save developer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/developers.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update developer data"
            git push
          fi
