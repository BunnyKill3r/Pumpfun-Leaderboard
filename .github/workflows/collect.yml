
name: Collect Pumpfun Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: pumpfun-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect aggregate statistics
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          folder = pathlib.Path('data')
          folder.mkdir(exist_ok=True)
          destination = folder / 'summary.json'
          now = datetime.now(timezone.utc)
          today = now.date()
          cutoff = today - timedelta(days=29)

          if destination.exists():
              existing = json.loads(destination.read_text())
              daily = existing.get('daily', {})
          else:
              daily = {}

          for offset in range(3):
              day = today - timedelta(days=offset)
              date = day.isoformat()
              url = f'https://pumpdata.fun/launches/{date}.json'
              print('Fetching:', date, flush=True)
              feed = None

              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'PumpLeaderboard/1.0'
                          }
                      )
                      with urllib.request.urlopen(
                          request, timeout=180
                      ) as response:
                          feed = json.load(response)
                      break
                  except (
                      urllib.error.URLError,
                      ConnectionError,
                      TimeoutError,
                      OSError,
                      json.JSONDecodeError
                  ) as error:
                      print(
                          'Attempt', attempt,
                          'failed:', type(error).__name__
                      )
                      if attempt < 3:
                          time.sleep(10 * attempt)

              if feed is None:
                  print(
                      'Feed unavailable; keeping previous summary for',
                      date
                  )
                  continue

              columns = feed['columns']
              if 'creator' not in columns:
                  print('Creator field missing; skipping', date)
                  continue

              creator_idx = columns.index('creator')
              graduation_idx = (
                  columns.index('deployer_graduations_before')
                  if 'deployer_graduations_before' in columns
                  else None
              )

              creators = set()
              experienced = set()
              total = 0

              for row in feed['launches']:
                  total += 1
                  creator = row[creator_idx]
                  if not isinstance(creator, str) or not creator:
                      continue
                  creators.add(creator)

                  if graduation_idx is not None:
                      try:
                          prior = float(
                              row[graduation_idx] or 0
                          )
                      except (TypeError, ValueError):
                          prior = 0
                      if prior >= 1:
                          experienced.add(creator)

              daily[date] = {
                  'tokens': total,
                  'unique_developers': len(creators),
                  'developers_with_previous_graduations':
                      len(experienced)
              }

              print(
                  'Summarised:', date,
                  'tokens:', total,
                  'developers:', len(creators),
                  flush=True
              )

          daily = {
              date: value
              for date, value in sorted(daily.items())
              if cutoff.isoformat() <= date <= today.isoformat()
          }

          result = {
              'updated_at': now.isoformat(),
              'period_start': cutoff.isoformat(),
              'period_end': today.isoformat(),
              'days_collected': len(daily),
              'note': (
                  'Daily counts only. Developer counts '
                  'cannot be summed across days to get '
                  'unique 30-day developers.'
              ),
              'total_launches_collected': sum(
                  v['tokens'] for v in daily.values()
              ),
              'daily': daily
          }

          destination.write_text(
              json.dumps(result, indent=2) + '\n'
          )

          print('DAYS COLLECTED:', len(daily))
          print(
              'TOTAL LAUNCHES COLLECTED:',
              result['total_launches_collected']
          )
          print('AGGREGATE SUMMARY READY')
          PY

      - name: Save summary to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          # Only stage the aggregate summary.
          git add -- data/summary.json

          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update aggregate Pumpfun statistics'
            git push
          fi
