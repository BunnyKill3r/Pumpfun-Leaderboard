
name: Test Pump.fun API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test API connection
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          key = os.environ.get("PUMP_API_KEY", "")

          if not key:
              raise SystemExit(
                  "ERROR: PUMP_API_KEY secret missing"
              )

          url = "https://api.pump.fun/v1/users"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  print("SUCCESS: API connected!")
                  print("HTTP status:", response.status)
                  print("Authentication test passed.")

          except urllib.error.HTTPError as error:
                  print("HTTP status:", error.code)
                  import json
                  try:
                      details = json.loads(error.read().decode())
                      print("API error code:", details.get("error"))
                      print("API message:", details.get("message"))
                  except (ValueError, UnicodeDecodeError):
                      print("Could not read API error details.")
                  raise SystemExit(1)

          except Exception as error:
              print("Connection error:",
                    type(error).__name__)
              raise SystemExit(1)
          PY
