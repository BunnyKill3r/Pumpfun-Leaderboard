
name: Test Pumpdata API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Pumpdata connection
        env:
          PUMP_API_KEY: ${{ secrets.PUMP_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("PUMP_API_KEY", "")
          if not key:
              raise SystemExit("API key secret missing")

          wallet = (
              "7ufmve7ZSFCzuNcKRunYrGtyb2Ka1MXzkWwf7jZhVsmL"
          )
          url = "https://pumpdata.fun/deployer/" + wallet

          request = urllib.request.Request(
              url,
              headers={"x-api-key": key}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  data = json.load(response)
                  print("SUCCESS: Pumpdata API connected!")
                  print("Developer:", data.get("address"))
                  print("Developer record:")
                  print(json.dumps(
                      data.get("record", {}),
                      indent=2
                  ))

          except urllib.error.HTTPError as error:
              print("HTTP error:", error.code)
              raise SystemExit(1)

          except Exception as error:
              print("Error:", type(error).__name__)
              raise SystemExit(1)
          PY
