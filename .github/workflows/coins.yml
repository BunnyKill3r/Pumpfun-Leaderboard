
name: Collect Developer Coins

on:
  workflow_dispatch:
  schedule:
    - cron: "32 */6 * * *"

permissions:
  contents: write

concurrency:
  group: developer-coins-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build rolling coin history
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import pathlib
          import urllib.request
          import time
          from datetime import datetime, timezone, timedelta

          folder = pathlib.Path("data")
          ranking = json.loads(
              (folder / "top100.json").read_text()
          )
          wallets = json.loads(
              (folder / "wallets.json").read_text()
          )

          top = ranking.get("top_100", [])
          wallet_map = {
              item["wallet"]: item["developer_id"]
              for item in wallets.get("developers", [])
              if item.get("wallet") and item.get("developer_id")
          }

          targets = {
              str(item["developer_id"])
              for item in top
          }

          output_path = folder / "developer-coins.json"
          previous = {}

          if output_path.exists():
              old = json.loads(output_path.read_text())
              for item in old.get("coins", []):
                  key = item.get("coin_id")
                  if key:
                      previous[key] = item

          today = datetime.now(timezone.utc).date()
          cutoff = (today - timedelta(days=29)).isoformat()

          coins = {
              key: item
              for key, item in previous.items()
              if item.get("launch_date", "") >= cutoff
              and item.get("developer_id") in targets
          }

          successful = 0
          new_count = 0

          for offset in range(3):
              day = today - timedelta(days=offset)
              date = day.isoformat()
              url = (
                  "https://pumpdata.fun/launches/"
                  + date + ".json"
              )

              feed = None

              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Pumpwatch/1.0"
                          }
                      )

                      with urllib.request.urlopen(
                          request, timeout=180
                      ) as response:
                          feed = json.load(response)

                      break
                  except Exception as error:
                      print(
                          "Feed unavailable:",
                          date,
                          str(error)[:120]
                      )
                      if attempt < 2:
                          time.sleep(10)

              if feed is None:
                  continue

              columns = feed.get("columns", [])
              required = {"creator", "mint"}

              if not required.issubset(set(columns)):
                  print("Missing required columns:", date)
                  continue

              creator_idx = columns.index("creator")
              mint_idx = columns.index("mint")

              successful += 1

              for row in feed.get("launches", []):
                  if not isinstance(row, (list, tuple)):
                      continue

                  if len(row) <= max(creator_idx, mint_idx):
                      continue

                  creator = row[creator_idx]
                  mint = row[mint_idx]

                  if not isinstance(creator, str):
                      continue
                  if not isinstance(mint, str):
                      continue

                  developer_id = wallet_map.get(creator)

                  if developer_id not in targets:
                      continue

                  # Use a stable token identifier.
                  # Keep raw mint addresses out of Git
                  # until publication is separately tested.
                  coin_id = hashlib.sha256(
                      mint.encode()
                  ).hexdigest()

                  if coin_id not in coins:
                      coins[coin_id] = {
                          "coin_id": coin_id,
                          "developer_id": developer_id,
                          "launch_date": date,
                          "graduated": None,
                          "peak_market_cap_usd": None
                      }
                      new_count += 1

              print(
                  date,
                  "total tracked coins:",
                  len(coins)
              )

          if successful == 0:
              raise RuntimeError(
                  "No launch feeds available; "
                  "existing history was preserved"
              )

          records = sorted(
              coins.values(),
              key=lambda item: (
                  item["launch_date"],
                  item["coin_id"]
              ),
              reverse=True
          )

          counts = {}

          for coin in records:
              identifier = coin["developer_id"]
              counts[identifier] = counts.get(identifier, 0) + 1

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "period_start": cutoff,
              "period_end": today.isoformat(),
              "developers_tracked": len(targets),
              "developers_with_coins": len(counts),
              "coins_tracked": len(records),
              "new_coins_this_run": new_count,
              "note": (
                  "Rolling observed coin history. "
                  "Older days were not backfilled. "
                  "Graduation and peak MC not yet collected."
              ),
              "coins": records
          }

          output_path.write_text(
              json.dumps(output, indent=2) + "\n"
          )

          print("Developer coin history saved")
          print("Coins:", len(records))
          print("Developers with coins:", len(counts))
          PY

      - name: Commit coin history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/developer-coins.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update developer coin history"
            git pull --rebase origin main
            git push
          fi
